name: Docker Compose Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  matrix-test:
    name: Build & Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file 
        run: | 
          cat > .env <<EOF 
          PYTHON_VERSION=${{ matrix.python-version }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DJANGO_DEBUG=${{ secrets.DJANGO_DEBUG }}
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          JWT_COOKIE_SECURE=${{ secrets.JWT_COOKIE_SECURE }}
          JWT_COOKIE_SAMESITE=${{ secrets.JWT_COOKIE_SAMESITE }}
          EOF

      - name: Build and Start Compose Stack
        run: docker compose up -d --build

      - name: Check Running Services
        run: docker compose ps

      - name: Test API Health Endpoint
        run: |
          sleep 10
          curl -f http://localhost/api/health/ || (docker compose logs web && exit 1)

      - name: Test Frontend UI Response
        run: curl -f http://localhost/

      - name: Tear Down Stack
        run: docker compose down -v

      - name: Remove temporary .env 
        if: always() # Runs step regardless of success/failure for clean up[cite: 8]
        run: rm -f .env

  # ── Deploy Job (Runs only after matrix-test passes) ─────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: matrix-test
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging # Links job to a named environment to trigger required reviewers[cite: 8]
    steps:
      - name: Deploy application
        run: echo "Deploying verified matrix build to staging infrastructure."